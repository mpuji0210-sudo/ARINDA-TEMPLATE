<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif;font-weight:300}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(17,17,17,0.06)}

#searchBox{display:none;max-width:1440px;margin:0 auto;padding:12px 20px;border-top:1px solid #F6F1EB;background:#fff;align-items:center;gap:10px}#searchBox.show{display:flex}
#searchBox input{flex:1;padding:12px 0;border:none;border-bottom:1px solid #111;background:transparent;outline:none;font-size:13px}
.s-btn{background:#111;color:#fff;border:none;padding:10px 18px;font-size:8px;letter-spacing:2px;border-radius:24px;cursor:pointer}

.k-card{background:#fff;border:1px solid var(--line);position:relative;cursor:pointer;border-radius:16px!important;overflow:hidden;transition:.3s}
.k-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.06)}
.k-card img{width:100%!important;height:145px!important;object-fit:cover!important;display:block!important;background:#F8F4EF!important}
.heart-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);z-index:3}.heart-btn svg{width:12px;height:12px;stroke:#111;fill:none;stroke-width:1.2}
.u-wrap{border:1px solid var(--line);background:#fff;display:flex;flex-wrap:wrap;border-radius:16px;overflow:hidden}
.u-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;flex:1;min-width:240px}
.u-item{position:relative;border-right:1px solid var(--line);cursor:pointer;background:#F6F1EB}.u-item img{width:100%!important;height:100px!important;object-fit:cover!important;display:block!important}
.u-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(17,17,17,.7));color:#fff;font-size:7px;letter-spacing:2px;text-align:center;padding:12px 4px 8px}
.fly-img{position:fixed;left:0;top:0;z-index:99999;width:60px;height:60px;object-fit:cover;border-radius:50%;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.25);border:2px solid #fff;transition:transform.9s,opacity.9s}
#cartToast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:12px 18px;border-radius:30px;display:flex;gap:10px;align-items:center;transition:.5s;opacity:0;z-index:100}#cartToast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(min-width:1024px){
 .nav-top{padding:18px 32px}.menu{padding:0 32px;gap:40px}.menu a{font-size:10px;letter-spacing:5px;padding:16px 0}
 .hero{height:72vh;min-height:520px;max-height:780px}.hero img{height:100%!important;object-fit:cover!important}
 .hero-text{left:48px;bottom:48px;max-width:520px}.hero-text h1{font-size:56px!important}
 .section{padding:40px 32px 0}.colors{grid-template-columns:repeat(4,1fr)!important;gap:20px!important}
 .k-card img{height:320px!important}.u-grid.u-item img{height:160px!important}
}
</style>

</div></div><div class="nav-menu"><div class="menu"><a class="active">BERANDA</a><a href="produk.html">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div>
<div id="searchBox"><input id="q" type="search" placeholder="CARI BAHAN ATAU WARNA" onkeydown="if(event.key==='Enter') doSearch()"><button class="s-btn" onclick="doSearch()">CARI</button><button class="s-btn" style="background:#fff;color:#111;border:1px solid #111" onclick="toggleSearch()">X</button></div></nav>
<div class="hero"><picture><source id="bannerSourcePC" media="(min-width:1024px)"><img id="bannerImg" alt="Banner ARINDA" width="1440" height="800"></picture><div class="hero-text"><div id="bannerTitle" style="font-size:9px;letter-spacing:5px;opacity:.7"></div><h1 style="font-family:'Cormorant Garamond';font-size:40px;line-height:.9;margin:10px 0 18px;font-weight:400">ARINDA HIJAB,<br>PREMIUM</h1><a id="bannerLink" href="produk.html" class="btn">LIHAT KOLEKSI →</a></div></div>
<div style="max-width:1440px;margin:0 auto;padding:20px 20px 0"><div class="u-wrap">
<div style="flex:1;min-width:300px;padding:20px"><div style="font-family:'Cormorant Garamond';font-size:20px;letter-spacing:4px">FIND YOUR UNDERTONE</div>
<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
<button onclick="setUndertone('cool')" id="u-cool" style="font-size:9px;letter-spacing:2px;padding:9px 16px;border:1px solid #111;background:#111;color:#fff;border-radius:20px;cursor:pointer">COOL</button>

<button onclick="setUndertone('neutral')" id="u-neutral" style="font-size:9px;letter-spacing:2px;padding:9px 16px;border:1px solid #111;background:#fff;color:#111;border-radius:20px;cursor:pointer">NEUTRAL</button>
<button onclick="setUndertone('olive')" id="u-olive" style="font-size:9px;letter-spacing:2px;padding:9px 16px;border:1px solid #111;background:#fff;color:#111;border-radius:20px;cursor:pointer">OLIVE</button>
</div><div id="uResult" style="margin-top:12px;font-size:11px;opacity:.6;line-height:1.6">Pilih Undertone Mu</div>
</div><div id="undertoneGrid" class="u-grid"></div></div></div>
<div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><div class="sub">BEST SELLER</div><a href="produk.html" style="font-size:9px;letter-spacing:3px;color:#111;text-decoration:none;border-bottom:1px solid #111;padding-bottom:4px">LIHAT SEMUA</a></div><div class="colors" id="koleksi4Grid"></div></div>
<footer style="margin-top:40px;padding:32px 20px;text-align:center;border-top:1px solid var(--line)"><div style="font-family:'Cormorant Garamond';letter-spacing:10px;font-size:16px">ARINDA</div><div style="font-size:7px;letter-spacing:6px;opacity:.4;margin-top:8px">HIJAB PREMIUM</div><div style="margin-top:14px;font-size:7px;letter-spacing:3px;opacity:.3">© 2026 ARINDA HIJAB PREMIUM</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" defer></script>
<script>
let supabaseClient;
function toggleSearch(){const b=document.getElementById('searchBox');const isHidden=b.style.display===''||b.style.display==='none';b.style.display=isHidden?'flex':'none';b.classList.toggle('show',isHidden);if(isHidden)setTimeout(()=>{document.getElementById('q').focus()},80);}
function doSearch(){const v=document.getElementById('q').value.trim();if(!v) return;location.href='produk.html?q='+encodeURIComponent(v.toLowerCase());}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();}
function updateCount(){const el=document.getElementById('cCount');if(el){el.innerText=getCart().reduce((a,b)=>a+Number(b.qty||0),0);}}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function showToast(t,i){document.getElementById('toastImg').src=i;document.getElementById('toastText').innerText=t;const el=document.getElementById('cartToast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}
function getOptImg(url,w=400){if(!url) return url; if(!url.includes('supabase.co/storage/v1/object/public/')) return url; try{const path=url.split('/object/public/')[1]; return `https://qjgevvizqeebtdqcbqmt.supabase.co/storage/v1/render/image/public/${path}?width=${w}&height=${w}&quality=80&format=webp&resize=contain`;}catch(e){return url;}}
function getBannerImg(url,w=1440){if(!url) return url; if(!url.includes('supabase.co/storage/v1/object/public/')) return url; try{const path=url.split('/object/public/')[1]; return `https://qjgevvizqeebtdqcbqmt.supabase.co/storage/v1/render/image/public/${path}?width=${w}&quality=80&format=webp&resize=contain`;}catch(e){return url;}}
function flyToCart(imgUrl, startEl){document.querySelectorAll('.fly-img').forEach(e=>e.remove());const cartIcon=document.getElementById('cartIcon'); if(!cartIcon) return;const cartRect=cartIcon.getBoundingClientRect();let startRect = startEl? startEl.getBoundingClientRect() : null;if(!startRect || startRect.width===0){startRect={left:innerWidth/2,top:innerHeight/2,width:80,height:80};}const startX=startRect.left+startRect.width/2-30,startY=startRect.top+startRect.height/2-30;const endX=cartRect.left+cartRect.width/2-30,endY=cartRect.top+cartRect.height/2-30;const fly=document.createElement('img');fly.src=getOptImg(imgUrl,80);fly.className='fly-img';fly.style.transform=`translate(${startX}px,${startY}px) scale(1)`;fly.style.opacity='1';document.body.appendChild(fly);fly.getBoundingClientRect();requestAnimationFrame(()=>{requestAnimationFrame(()=>{fly.style.transform=`translate(${endX}px,${endY}px) scale(0.15)`;fly.style.opacity='0';});});setTimeout(()=>fly.remove(),950);}
function quickAdd(title,img,el,idx){const imgEl=document.getElementById('img-best-'+idx)||(el?el.closest('.k-card')?.querySelector('img'):null);if(imgEl)flyToCart(imgEl.src||img,imgEl);addCart(title,99000,img);showToast(title+' MASUK KERANJANG',getOptImg(img,80));}
const underData={cool:{desc:'<b>COOL</b> — Urat biru. Cocok: <b>NAVY, MAROON, GREY</b>',col:'COOL'},warm:{desc:'<b>WARM</b> — Urat hijau. Cocok: <b>KREM, OLIVE, CARAMEL</b>',col:'WARM'},neutral:{desc:'<b>NEUTRAL</b> — Campuran. Cocok: <b>MAUVE, DUSTY, BEIGE</b>',col:'NEUTRAL'},olive:{desc:'<b>OLIVE</b> — Sawo matang. Cocok: <b>SAGE, KHAKI, TERRACOTTA</b>',col:'OLIVE'}};
function setUndertone(t){document.querySelectorAll('[id^="u-"]').forEach(b=>{b.style.background='#fff';b.style.color='#111'});const cur=document.getElementById('u-'+t);if(cur){cur.style.background='#111';cur.style.color='#fff';}const d=underData[t];const res=document.getElementById('uResult');if(res){res.innerHTML=d.desc+` <br><a href="produk.html?undertone=${d.col}" style="font-size:9px;letter-spacing:3px;color:#111;text-decoration:none;border-bottom:1px solid #111;margin-top:8px;display:inline-block">LIHAT WARNA ${d.col} →</a>`;}}
async function init(){
  await new Promise(r=>{ const check=()=>{ if(window.supabase){ supabaseClient=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19'); r(); } else setTimeout(check,50); }; check(); });
  try{
    const{data:banners}=await supabaseClient.from('banners').select('image_url,image_mobile_url,title,link_url').eq('is_active',true).order('created_at',{ascending:false}).limit(1);
    if(banners&&banners[0]){
      const img=document.getElementById('bannerImg');const srcPC=document.getElementById('bannerSourcePC');
      if(img){img.src=getBannerImg(banners[0].image_mobile_url||banners[0].image_url,800);if(srcPC) srcPC.srcset=getBannerImg(banners[0].image_url,1440);}
      const bt=document.getElementById('bannerTitle'); if(bt) bt.innerText=banners[0].title||'ELEGANCE IN EVERY LAYER';
      const bl=document.getElementById('bannerLink'); if(bl) bl.href=banners[0].link_url||'produk.html';
    }
    const{data:settings}=await supabaseClient.from('settings').select('key,value').in('key',['home_koleksi_terlaris','home_undertone_images']);
    if(settings){
      const get=k=>settings.find(s=>s.key===k)?.value;
      try{
        const raw=JSON.parse(get('home_koleksi_terlaris')||'[]');
        if(raw.length){
          const grid=document.getElementById('koleksi4Grid');
          if(grid) grid.innerHTML=raw.slice(0,8).map((v,i)=>{
            const url=typeof v==='string'?v:v.url; const title=(typeof v==='object'?v.title:'')||''; const safeTitle=title.replace(/'/g,"").toUpperCase()||'BEST'; const link=title?'produk.html?warna='+encodeURIComponent(safeTitle):'produk.html';
            return `<div class="k-card"><img id="img-best-${i}" src="${getOptImg(url,400)}" loading="lazy" width="400" height="400" alt="${safeTitle}" onclick="location.href='${link}'"><div class="heart-btn" onclick="quickAdd('${safeTitle}','${url}', this, ${i})"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><div style="padding:10px 12px;border-top:1px solid #F6F1EB;font-size:8px;letter-spacing:2px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" onclick="location.href='${link}'">${safeTitle}</div></div>`
          }).join('');
        }
      }catch(e){}
      try{
        const rawU=get('home_undertone_images');if(rawU){
          const uImgs=JSON.parse(rawU);const grid=document.getElementById('undertoneGrid');
          if(grid&&uImgs.length){grid.innerHTML=uImgs.slice(0,4).map((it,i)=>{const url=typeof it==='string'?it:it.url; const label=typeof it==='object'?(it.title||''):`FOTO ${i+1}`; const low=label.toLowerCase(); let ut='NEUTRAL'; if(low.includes('cool')) ut='COOL'; else if(low.includes('warm')) ut='WARM'; else if(low.includes('olive')) ut='OLIVE';return `<div class="u-item" onclick="location.href='produk.html?undertone=${ut}'"><img src="${getOptImg(url,300)}" loading="lazy" width="300" height="200" alt="${label}"><div class="u-label">${label||ut}</div></div>`}).join('');}
        }
      }catch(e){}
    }
  }catch(e){} updateCount();
}
init();
</script></body></html>
